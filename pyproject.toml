[project]
name = "hawkspot"
version = "0.0.2"
description = "Tracking objects using MAVLink"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dronekit @ https://github.com/MissouriMRR/docs/raw/refs/heads/main/subteams/flight/installation_guide/dronekit-2.9.2-py310-none-any.whl",
    "future>=1.0.0",
    "opencv-contrib-python>=4.13.0.92"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"

[tool.uv]
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
dronekit = { url = "https://github.com/MissouriMRR/docs/raw/refs/heads/main/subteams/flight/installation_guide/dronekit-2.9.2-py310-none-any.whl" }

[tool.ty.environment]
python = ".venv"

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["."]
include = ["hawkspot*"]

[dependency-groups]
dev = [
    "dt-apriltags>=3.1.7",
    "onnxruntime>=1.24.2",
    "picamera2>=0.3.34",
    "pre-commit>=4.5.1",
    "ruff>=0.15.9",
    "siyi-sdk>=0.2.12",
    "torchvision>=0.25.0",
]
